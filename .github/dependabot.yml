version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: []
    commit-message:
      prefix: chore

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    labels: []
    commit-message:
      prefix: chore
    groups:
      gradle:
        patterns: ["*"]
